name: HANZ Push Test FID Self Heal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PYTHONPATH: src

    steps:
      - name: Checkout HANZ repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "firebase-admin>=7.5.0" requests

      - name: Send self-healing FID test
        run: python -m hanz_app.push_test_self_heal

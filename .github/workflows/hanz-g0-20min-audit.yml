name: HANZ G0 20-Minute Audit

on:
  push:
    paths:
      - '.github/workflows/hanz-g0-20min-audit.yml'
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hanz-g0-20min-audit
  cancel-in-progress: false

jobs:
  audit:
    name: G0 evidence and freshness audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit recent GitHub Actions and freshness evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          # GitHub job logs redirect to a signed storage URL. Never forward
          # the GitHub bearer token to another host: it can cause HTTP 401
          # and unnecessarily expose credentials outside api.github.com.
          class SafeLogRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected and urllib.parse.urlsplit(req.full_url).netloc != urllib.parse.urlsplit(newurl).netloc:
                      redirected.remove_header("Authorization")
                  return redirected

          # Offline regression: preserve GitHub API auth, strip cross-host auth.
          handler = SafeLogRedirect()
          sample = urllib.request.Request("https://api.github.com/jobs/1/logs",
                                          headers={"Authorization": "Bearer dummy"})
          assert "Authorization" not in handler.redirect_request(
              sample, None, 302, "Found", {}, "https://storage.example/logs").headers
          assert "Authorization" in handler.redirect_request(
              sample, None, 302, "Found", {}, "https://api.github.com/next").headers
          log_opener = urllib.request.build_opener(handler)
          from datetime import datetime, timezone
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req, timeout=25) as response:
              runs = json.load(response).get("workflow_runs", [])
          # A 190/198 partial feed is diagnostic evidence, not G0 completion.
          def complete_coverage(covered, universe):
              return universe >= 198 and covered >= universe
          assert not complete_coverage(193, 198)
          assert complete_coverage(198, 198)
          # STALE is an explicit operational state, never an unknown mode or LIVE.
          def mode_evidence_error(mode, age):
              if mode == "LIVE":
                  try:
                      return "FAST live candle exceeds 1800 seconds" if age is None or float(age) > 1800 else None
                  except (TypeError, ValueError, OverflowError):
                      return "FAST live candle age invalid"
              if mode == "CLOSED_SESSION":
                  return None
              if mode == "STALE":
                  return "FAST intraday evidence STALE (not live)"
              return "FAST operational mode unknown"
          assert mode_evidence_error("STALE", 80000) == "FAST intraday evidence STALE (not live)"
          assert mode_evidence_error("LIVE", 1801) == "FAST live candle exceeds 1800 seconds"
          assert mode_evidence_error("LIVE", 300) is None
          assert mode_evidence_error("CLOSED_SESSION", 80000) is None
          patterns = {
              "scanner": ("swing scanner",),
              "ci": ("hanz ci",),
              "pages": ("pages",),
              "watchdog": ("watchdog",),
              "itick": ("itick", "idx coverage"),
              "fast": ("fast runtime",),
          }
          print("G0 AUDIT UTC:", datetime.now(timezone.utc).isoformat())
          failures = []
          for key, names in patterns.items():
              # An in-progress run is not a failure: use the most recent
              # completed run and report pending separately.
              candidates = [r for r in runs if any(n in r.get("name", "").lower() for n in names)
                            and r.get("name") != "HANZ G0 20-Minute Audit"]
              pending = next((r for r in candidates if r.get("status") != "completed"), None)
              match = next((r for r in candidates if r.get("status") == "completed"), None)
              if pending:
                  print(f"{key}: PENDING {pending.get('html_url')}")
              if not match:
                  print(f"{key}: UNKNOWN (no run in most recent 100)")
                  if key in ("scanner", "ci", "pages", "watchdog", "fast"):
                      failures.append(key + ": missing evidence")
                  continue
              print(f"{key}: {match.get('status')}/{match.get('conclusion')} at {match.get('updated_at')} {match.get('html_url')}")
              if key in ("scanner", "ci", "pages", "watchdog", "fast") and (
                  match.get("status") != "completed" or match.get("conclusion") != "success"
              ):
                  failures.append(key + ": not successful")
          # Read the newest completed FAST run, including failures. Selecting only
          # successful runs masks newer STALE/PARTIAL evidence with an old PASS.
          def latest_completed_fast(items):
              candidates = [r for r in items if "fast runtime" in r.get("name", "").lower()
                            and r.get("status") == "completed"]
              return max(candidates, key=lambda r: r.get("created_at") or "", default=None)
          test_runs = [
              {"name": "HANZ FAST Runtime Evidence", "status": "completed", "conclusion": "success",
               "created_at": "2026-10-22T10:00:00Z", "id": 1},
              {"name": "HANZ FAST Runtime Evidence", "status": "completed", "conclusion": "failure",
               "created_at": "2026-10-23T10:00:00Z", "id": 2},
          ]
          assert latest_completed_fast(test_runs)["id"] == 2
          assert latest_completed_fast([]) is None
          fast_run = latest_completed_fast(runs)
          if not fast_run:
              failures.append("FAST evidence unavailable")
          else:
              jobs_req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{fast_run['id']}/jobs?per_page=20",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(jobs_req, timeout=25) as response:
                  jobs = json.load(response).get("jobs", [])
              evidence = None
              for job in jobs:
                  log_req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/jobs/{job['id']}/logs",
                      headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
                  )
                  with log_opener.open(log_req, timeout=25) as response:
                      log_text = response.read().decode("utf-8", errors="replace")
                  for line in log_text.splitlines():
                      marker = "HANZ FAST RUNTIME: "
                      if marker in line:
                          try:
                              evidence = json.loads(line.split(marker, 1)[1])
                          except (ValueError, TypeError):
                              continue
              if not evidence:
                  failures.append("FAST structured evidence missing")
              else:
                  mode = evidence.get("operational_mode")
                  coverage = int(evidence.get("coverage_count") or 0)
                  universe = int(evidence.get("universe_count") or 0)
                  age = evidence.get("health", {}).get("data_age_seconds")
                  bar = evidence.get("health", {}).get("last_market_bar_at")
                  print(f"FAST_EVIDENCE: mode={mode} coverage={coverage}/{universe} age={age}s bar={bar}")
                  if evidence.get("runtime_evidence") != "PASS" or not complete_coverage(coverage, universe):
                      failures.append("FAST coverage/runtime incomplete for G0 (full universe required)")
                  blocker = mode_evidence_error(mode, age)
                  if blocker:
                      failures.append(blocker)
                  elif mode == "CLOSED_SESSION":
                      print("LIVE_FRESHNESS: NOT VERIFIED (closed-session evidence only)")
          print("G0_OPERATIONAL_AUDIT:", "PASS" if not failures else "FAIL")
          if failures:
              print("BLOCKERS:", "; ".join(failures))
              sys.exit(1)
          PY

name: HANZ Top 5 Backtest 5Y

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/hanz_app/research/generate_top5_5y_backtest.py"
      - ".github/workflows/hanz-top5-backtest-5y.yml"
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: hanz-top5-backtest-5y
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout HANZ repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate real 5Y backtest
        id: generate
        run: python -m hanz_app.research.generate_top5_5y_backtest

      - name: Show generated summary
        run: cat docs/dashboard/swing/backtest-5y.json

      - name: Require complete G1 Top 5 five-year evidence before publishing
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          report = json.loads(Path("docs/dashboard/swing/backtest-5y.json").read_text())
          coverage = report.get("coverage") or {}
          symbols = report.get("selected_top5") or []
          results = report.get("results") or {}
          def has_complete_history(symbol):
              row = results.get(symbol)
              if not isinstance(row, dict) or row.get("status") != "OK":
                  return False
              try:
                  start = date.fromisoformat(row["span_start"])
                  end = date.fromisoformat(row["span_end"])
                  try:
                      anniversary = start.replace(year=start.year + 5)
                  except ValueError:
                      anniversary = start.replace(year=start.year + 5, day=28)
                  days = row["distinct_trading_days"]
                  bars = row["bars"]
                  gap = row["max_gap_days"]
                  return (
                      end >= anniversary
                      # Reject complete but years-old or future-dated replay data.
                      # Five-year history must still end near this workflow run.
                      and 0 <= (date.today() - end).days <= 7
                      and all(isinstance(value, int) and not isinstance(value, bool)
                              for value in (days, bars, gap))
                      and days >= 1000
                      and bars >= days
                      and 0 < gap <= 45
                  )
              except (KeyError, TypeError, ValueError, OverflowError):
                  return False
          valid = (
              coverage.get("backtest_complete") is True
              and coverage.get("selected_count") == 5
              and coverage.get("evaluated_count") == 5
              and coverage.get("five_year_history_count") == 5
              and coverage.get("unavailable_count") == 0
              and coverage.get("all_selected_accounted_for") is True
              and len(symbols) == len(set(symbols)) == 5
              and all(has_complete_history(s) for s in symbols)
          )
          if not valid:
              raise SystemExit("G1 backtest incomplete: refusing to publish incomplete five-year Top 5 evidence")
          PY

      - name: Commit backtest result
        run: |
          git config user.name "HANZ Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dashboard/swing/backtest-5y.json
          if git diff --cached --quiet; then
            echo "No backtest changes to commit."
          else
            git commit -m "Update HANZ Top 5 5Y backtest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload backtest artifact
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: hanz-top5-backtest-5y
          path: docs/dashboard/swing/backtest-5y.json
          if-no-files-found: error
          retention-days: 90

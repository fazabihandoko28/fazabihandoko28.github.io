name: HANZ Walk-Forward Validation

on:
  workflow_dispatch:
    inputs:
      trades_csv:
        description: "Path to sequential OOS trade evidence CSV"
        required: true
        default: "src/hanz_app/research/walk_forward_results/trades.csv"
        type: string
      windows_csv:
        description: "Path to walk-forward window evidence CSV"
        required: true
        default: "src/hanz_app/research/walk_forward_results/windows.csv"
        type: string
      dof_remaining_pct:
        description: "Degrees of freedom remaining (%)"
        required: true
        default: "90"
        type: string

permissions:
  contents: read

concurrency:
  group: hanz-walk-forward-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate WFA evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install validator dependency
        run: python -m pip install --upgrade pip pandas

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f "src/hanz_app/research/hanz_walk_forward_evidence_validator.py" || {
            echo "Validator not found: src/hanz_app/research/hanz_walk_forward_evidence_validator.py"
            exit 1
          }
          test -f "${{ inputs.trades_csv }}" || {
            echo "Trades evidence not found: ${{ inputs.trades_csv }}"
            exit 1
          }
          test -f "${{ inputs.windows_csv }}" || {
            echo "Window evidence not found: ${{ inputs.windows_csv }}"
            exit 1
          }

      - name: Run Pardo-style evidence validation
        id: wfa
        shell: bash
        run: |
          set +e
          mkdir -p .hanz-wfa

          python src/hanz_app/research/hanz_walk_forward_evidence_validator.py \
            --trades "${{ inputs.trades_csv }}" \
            --windows "${{ inputs.windows_csv }}" \
            --dof-remaining-pct "${{ inputs.dof_remaining_pct }}" \
            --json-out .hanz-wfa/wfa_validation.json \
            --env-out .hanz-wfa/wfa_evidence.env \
            | tee .hanz-wfa/wfa_validation.log

          status=${PIPESTATUS[0]}
          echo "validator_exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ -f .hanz-wfa/wfa_evidence.env ]; then
            while IFS= read -r line; do
              case "$line" in
                HANZ_STRATEGY_WFA_VALIDATED=*)
                  echo "passed=${line#*=}" >> "$GITHUB_OUTPUT"
                  ;;
              esac
            done < .hanz-wfa/wfa_evidence.env
          fi

          exit 0

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## HANZ Walk-Forward Validation"
            echo
            if [ -f .hanz-wfa/wfa_evidence.env ]; then
              echo '```text'
              cat .hanz-wfa/wfa_evidence.env
              echo '```'
            else
              echo "No evidence output was produced."
            fi
            echo
            echo "Validator exit code: ${{ steps.wfa.outputs.validator_exit_code }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WFA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanz-wfa-evidence-${{ github.run_number }}
          path: .hanz-wfa/
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          code="${{ steps.wfa.outputs.validator_exit_code }}"
          if [ -z "$code" ]; then
            echo "WFA validator did not run successfully."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "HANZ WFA validation FAILED. Keep real-money gate locked."
            exit "$code"
          fi
          echo "HANZ WFA validation PASSED. Evidence artifact has been produced."

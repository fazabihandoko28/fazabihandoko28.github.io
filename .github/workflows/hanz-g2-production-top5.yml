name: HANZ G2 Production Top 5 Research

on:
  # Post-IDX-close UTC sampling; stagger away from the half-hour and add a
  # second daily opportunity because GitHub scheduled events may be delayed/dropped.
  # Both executions remain read-only and fail closed on stale market evidence.
  schedule:
    - cron: '47 11 * * 1-5'
    - cron: '17 12 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/hanz_app/research/g2_*.py"
      - "tests/test_g2_*.py"
      - ".github/workflows/hanz-g2-production-top5.yml"

permissions:
  contents: read

jobs:
  g2-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: G2 selector and adapter regression
        run: python -m unittest discover -s tests -p 'test_g2_*.py' -v
      - name: Retrieve actual production monitor and select research Top 5
        run: python -m hanz_app.research.g2_production_top5
      - name: Verify evidence safety and source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("docs/dashboard/swing/g2-top5-research.json").read_text())
          assert r["source"] == "hanz_swing_signal_monitor"
          assert r["production_data_retrieved"] is True
          assert r["research_only"] is True
          assert r["buy_authorized"] is False
          assert r["oos_certified"] is False
          assert r["live_verified"] is False
          assert len(r["selected"]) == len(set(r["selected"]))
          assert len(r["selected"]) <= 5
          assert r["vacant_slots"] == 5 - len(r["selected"])
          assert r["source_rows"] > 0
          assert len(r["replacement_probes"]) == len(r["selected"])
          assert {p["removed_ticker"] for p in r["replacement_probes"]} == set(r["selected"])
          assert all(p["replacement_ticker"] is None or
                     p["replacement_ticker"] not in r["selected"]
                     for p in r["replacement_probes"])
          assert all(p["verified"] == (p["replacement_ticker"] is not None)
                     for p in r["replacement_probes"])
          assert r["replacement_verified_count"] == sum(
              p["verified"] for p in r["replacement_probes"])
          assert r["replacement_probes_complete"] == (
              bool(r["replacement_probes"]) and all(
                  p["verified"] for p in r["replacement_probes"]))
          assert r["candidate_replacement_evidence"] == (
              "ALL_SELECTED_REPLACEMENTS_VERIFIED" if r["replacement_probes_complete"]
              else "PARTIAL_REPLACEMENT_EVIDENCE" if r["replacement_verified_count"]
              else "INSUFFICIENT_ELIGIBLE_CANDIDATES" if not r["selected"]
              else "NO_ELIGIBLE_REPLACEMENT_IN_SNAPSHOT")
          assert r["testing_data_policy"] == "LATEST_AVAILABLE_REAL_SNAPSHOT"
          assert r["testing_reference_snapshot_at"] == r["source_latest_at_cutoff"]
          assert r["testing_reference_snapshot_at"] is not None
          assert r["testing_session_verified"] is False
          assert r["market_session_freshness_verified"] is False
          # This step runs only after the G2 regression command succeeds.
          # Record the actual CI provenance, not a default production claim.
          import os
          r["integration_regression_verified"] = True
          r["risk_safety_verified"] = True
          r["ci_evidence"] = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "regression_scope": "test_g2_*.py",
              "risk_safety_scope": "read-only production evidence assertions",
          }
          Path("docs/dashboard/swing/g2-top5-research.json").write_text(
              json.dumps(r, indent=2, sort_keys=True) + "\n")
          print("G2 read-only evidence and safety assertions PASS")
          PY
      - name: Evaluate fail-closed G2 certification gates
        run: |
          set -o pipefail
          python -m hanz_app.research.g2_certification_gate | tee docs/dashboard/swing/g2-certification-gates.json
          python -m json.tool docs/dashboard/swing/g2-certification-gates.json > /dev/null
      - name: Upload actual production research evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hanz-g2-production-top5
          path: |
            docs/dashboard/swing/g2-top5-research.json
            docs/dashboard/swing/g2-certification-gates.json
          if-no-files-found: warn
          retention-days: 30

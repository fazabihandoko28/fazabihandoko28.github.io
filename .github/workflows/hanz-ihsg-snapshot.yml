name: HANZ IHSG Snapshot

on:
  workflow_dispatch:

  schedule:
    # WIB market-hours snapshots only: 09:10, 11:10, 14:10.
    # GitHub cron uses UTC.
    - cron: "10 2,4,7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: hanz-ihsg-snapshot
  cancel-in-progress: false

jobs:
  ihsg-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout HANZ repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh IHSG snapshot only during live IDX session
        run: |
          python -m hanz_app.ihsg_snapshot

      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- docs/dashboard/swing/ihsg-snapshot.json; then
            echo "No IHSG snapshot change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/swing/ihsg-snapshot.json
          git commit -m "Update IHSG dashboard snapshot"
          git push

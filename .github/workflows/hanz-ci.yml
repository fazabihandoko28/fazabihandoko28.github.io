name: HANZ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install HANZ Intelligence
        run: python -m pip install -e .

      - name: Compile Python source
        run: python -m compileall -q src tools

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run repository audit
        run: python tools/audit_repository.py

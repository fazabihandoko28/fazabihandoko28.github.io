name: HANZ Paper Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: hanz-paper-scan-main
  cancel-in-progress: false

jobs:
  scan-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install HANZ Intelligence
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run BEI paper scan
        run: >-
          python -m hanz_app.paper_scan
          --universe config/universe/pilot_universe.csv
          --markets BEI
          --period 1y
          --interval 1d
          --candidate-limit 5
          --output artifacts/paper_scans/latest.json

      - name: Update paper journal
        run: >-
          python -m hanz_app.update_journal
          --scan artifacts/paper_scans/latest.json
          --journal artifacts/paper_trading/journal.json

      - name: Render Alpha report
        run: >-
          python -m hanz_app.render_report
          --input artifacts/paper_scans/latest.json
          --output dashboard/index.html

      - name: Publish lean latest-only dashboard
        run: >-
          python tools/publish_scan_results.py
          --scan artifacts/paper_scans/latest.json
          --report dashboard/index.html
          --dashboard-dir dashboard

      - name: Commit latest results to repository
        run: |
          git config user.name "HANZ Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            artifacts/paper_scans/latest.json \
            artifacts/paper_trading/journal.json \
            dashboard/index.html \
            dashboard/data/latest.json \
            dashboard/last_update.txt \
            dashboard/history
          if git diff --cached --quiet; then
            echo "No paper result changes to commit."
          else
            git commit -m "chore: update latest HANZ paper scan"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload temporary backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: hanz-alpha-report
          path: |
            dashboard/index.html
            dashboard/data/latest.json
            artifacts/paper_scans/latest.json
            artifacts/paper_trading/journal.json
          if-no-files-found: error
          retention-days: 30

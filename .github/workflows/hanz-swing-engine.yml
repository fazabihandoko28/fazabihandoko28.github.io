name: HANZ Swing Scanner

on:
  push:
    branches: [main]
    paths:
      - "src/hanz_app/swing_trading_engine.py"
      - "src/hanz_app/premarket_bullish_predictor.py"
      - ".github/workflows/hanz-swing-engine.yml"
  workflow_dispatch:

  schedule:
    # 08:35 WIB = 01:35 UTC. Build today's bullish Top-5 from the latest
    # completed daily bars before the pre-open auction. This is prediction-only;
    # it never creates a confirmed BUY.
    - cron: "0 0 * * 1-5"
    - cron: "35 1 * * 1-5"

    # Heavy scanner is not scheduled every 15 minutes: it takes longer
    # than the trigger interval and would continually cancel itself.
    # Intraday risk monitoring requires a separate lightweight workflow.

    # 16:20 WIB = 09:20 UTC, after IDX post-close completion at 16:15.
    # Never schedule the final completed-bar scan during post-close processing.
    - cron: "20 9 * * 1-5"
    - cron: "0 11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: hanz-swing-scanner
  cancel-in-progress: false

jobs:
  swing-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      INDEX_ALPHA_API_KEY: ${{ secrets.INDEX_ALPHA_API_KEY }}
      ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
      HANZ_MARKET_DATA_PRIMARY: "AUTO"
      HANZ_SWING_DASHBOARD_URL: https://fazabihandoko28.github.io/dashboard/swing/
      HANZ_SWING_RUN_ONCE: "1"
      HANZ_SWING_AFTER_HOURS_SCAN: "0"
      HANZ_SWING_MAX_SYMBOLS_PER_CYCLE: "220"
      HANZ_SWING_TRAILING_ATR_T1: "1.5"
      HANZ_SWING_TRAILING_ATR_T2: "1.0"
      HANZ_RADAR_INTRADAY_INTERVAL: "15m"
      HANZ_RADAR_INTRADAY_PERIOD: "5d"

    steps:
      - name: Checkout HANZ repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify final daily scan is after IDX post-close
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          workflow = Path(".github/workflows/hanz-swing-engine.yml").read_text()
          assert '- cron: "20 9 * * 1-5"' in workflow
          assert '- cron: "10 9 * * 1-5"' not in workflow
          local = datetime(2026, 10, 23, 9, 20, tzinfo=timezone.utc).astimezone(ZoneInfo("Asia/Jakarta"))
          assert (local.hour, local.minute) > (16, 15)
          PY

      - name: Run HANZ Swing Scanner
        run: |
          python -m hanz_app.swing_entry_runner

name: HANZ Swing Engine

on:
  workflow_dispatch:

  schedule:
    # Every hour, Monday-Friday.
    # GitHub Actions cron uses UTC.
    - cron: "10 * * * 1-5"

permissions:
  contents: read

concurrency:
  group: hanz-swing-engine
  cancel-in-progress: false

jobs:
  swing-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      HANZ_SWING_RUN_ONCE: "1"
      HANZ_SWING_MAX_SYMBOLS_PER_CYCLE: "60"

    steps:
      - name: Checkout HANZ repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HANZ Swing Engine
        run: |
          python -m hanz_app.swing_trading_engine

name: HANZ Swing Scanner

on:
  workflow_dispatch:

  schedule:
    # 16:10 WIB = 09:10 UTC
    # Full 200-stock scan only after IDX close.
    # Python calendar gate blocks weekends and IDX holidays.
    - cron: "10 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: hanz-swing-scanner
  cancel-in-progress: false

jobs:
  swing-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      HANZ_SWING_DASHBOARD_URL: https://fazabihandoko28.github.io/dashboard/swing/
      HANZ_SWING_RUN_ONCE: "1"
      HANZ_SWING_MAX_SYMBOLS_PER_CYCLE: "220"
      HANZ_SWING_TRAILING_ATR_T1: "1.5"
      HANZ_SWING_TRAILING_ATR_T2: "1.0"

    steps:
      - name: Checkout HANZ repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HANZ Swing Scanner
        run: |
          python -m hanz_app.swing_trading_engine

name: HANZ Swing Scanner

on:
  workflow_dispatch:

  schedule:
    # IDX intraday predictive radar.
    # 02:00-08:45 UTC = 09:00-15:45 WIB, Monday-Friday.
    # The Python market/session gate handles lunch breaks, weekends and IDX holidays.
    # This lets HANZ continuously detect support bounces / early momentum instead of
    # waking up only after the exchange has closed.
    - cron: "*/15 2-8 * * 1-5"

    # 16:10 WIB = 09:10 UTC.
    # Final completed-bar scan after IDX close.
    - cron: "10 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: hanz-swing-scanner
  cancel-in-progress: true

jobs:
  swing-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      INDEX_ALPHA_API_KEY: ${{ secrets.INDEX_ALPHA_API_KEY }}
      ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
      HANZ_MARKET_DATA_PRIMARY: "AUTO"
      HANZ_SWING_DASHBOARD_URL: https://fazabihandoko28.github.io/dashboard/swing/
      HANZ_SWING_RUN_ONCE: "1"
      HANZ_SWING_MAX_SYMBOLS_PER_CYCLE: "220"
      HANZ_SWING_TRAILING_ATR_T1: "1.5"
      HANZ_SWING_TRAILING_ATR_T2: "1.0"
      HANZ_RADAR_INTRADAY_INTERVAL: "15m"
      HANZ_RADAR_INTRADAY_PERIOD: "5d"

    steps:
      - name: Checkout HANZ repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HANZ Swing Scanner
        run: |
          python -m hanz_app.swing_entry_runner
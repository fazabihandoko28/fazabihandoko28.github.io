
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>HANZ — Swing Intelligence</title>

<style>
:root{
  --bg:#050914;
  --bg2:#080e1a;
  --card:#0d1627;
  --card2:#111d31;
  --line:rgba(148,163,184,.16);
  --text:#f8fafc;
  --muted:#8291a8;
  --green:#28e0a2;
  --blue:#4da3ff;
  --cyan:#48d7ff;
  --yellow:#ffc857;
  --red:#ff6572;
  --purple:#a879ff;
  --radius:20px;
  --shadow:0 18px 55px rgba(0,0,0,.24);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 90% 0%,rgba(77,163,255,.16),transparent 28%),
    radial-gradient(circle at 10% 18%,rgba(40,224,162,.08),transparent 24%),
    linear-gradient(180deg,#050914,#070d18 60%,#050914);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom,black,transparent 76%);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:auto;padding:18px 22px 105px}

/* HEADER */
.header{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  min-height:66px;margin-bottom:16px
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
  font-weight:950;font-size:19px;color:#03120d;
  background:linear-gradient(135deg,var(--green),var(--cyan));
  box-shadow:0 10px 30px rgba(40,224,162,.18)
}
.brand strong{display:block;font-size:18px;letter-spacing:.7px}
.brand span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.header-actions{display:flex;align-items:center;gap:8px}
.live-pill{
  display:flex;align-items:center;gap:7px;min-height:37px;padding:0 12px;
  border-radius:999px;border:1px solid var(--line);background:rgba(9,16,30,.72);
  color:var(--muted);font-size:10px;font-weight:800
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.dot.online{background:var(--green);box-shadow:0 0 14px rgba(40,224,162,.9)}
.secondary-btn,.primary-btn{
  min-height:37px;padding:0 12px;border-radius:11px;font-size:10px;font-weight:800
}
.secondary-btn{border:1px solid var(--line);background:rgba(9,16,30,.72);color:#dbe4f0}
.primary-btn{
  border:none;background:linear-gradient(135deg,var(--green),var(--cyan));
  color:#04130e;font-weight:950
}
.primary-btn:disabled{opacity:.4;cursor:not-allowed}
.user-area{display:none;align-items:center;gap:9px}
.push-on{color:var(--green)!important;border-color:rgba(40,224,162,.38)!important}
.push-denied{color:var(--red)!important;border-color:rgba(255,101,114,.35)!important}
.user-info{text-align:right}
.user-info strong{display:block;font-size:10px}
.user-info span{display:block;margin-top:2px;color:var(--muted);font-size:8px}

/* HERO */
.hero{
  position:relative;overflow:hidden;min-height:190px;padding:27px;
  display:flex;align-items:center;border:1px solid var(--line);border-radius:27px;
  background:linear-gradient(120deg,rgba(14,23,42,.96),rgba(7,14,27,.88));
  box-shadow:var(--shadow);margin-bottom:12px
}
.hero:after{
  content:"";position:absolute;width:420px;height:420px;border-radius:50%;
  right:-150px;top:-210px;
  background:radial-gradient(circle,rgba(77,163,255,.28),transparent 68%)
}
.hero-content{position:relative;z-index:2;display:flex;width:100%;align-items:flex-end;justify-content:space-between;gap:30px}
.hero small{color:var(--green);font-size:9px;font-weight:900;letter-spacing:1.3px}
.hero h1{margin:9px 0 7px;max-width:720px;font-size:35px;line-height:1.07;letter-spacing:-1px}
.hero p{max-width:650px;margin:0;color:var(--muted);font-size:11px;line-height:1.6}
.hero-top{
  min-width:245px;padding:16px;border:1px solid rgba(255,255,255,.07);
  border-radius:17px;background:rgba(2,8,18,.42)
}
.hero-top span{color:var(--muted);font-size:8px;letter-spacing:.8px}
.hero-top strong{display:block;margin-top:7px;font-size:25px}
.hero-top small{display:block;margin-top:6px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{
  min-height:105px;padding:15px;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(145deg,rgba(14,23,42,.88),rgba(8,15,28,.75))
}
.kpi span{color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.7px}
.kpi strong{display:block;margin-top:8px;font-size:24px}
.kpi small{display:block;margin-top:5px;color:var(--muted);font-size:9px}
.green-text{color:var(--green)!important}.red-text{color:#ff8992!important}.yellow-text{color:var(--yellow)!important}


/* NAV */
.desktop-nav{
  display:flex;gap:5px;width:max-content;padding:4px;margin:0 0 13px;
  border:1px solid var(--line);border-radius:13px;background:rgba(8,15,27,.68)
}
.desktop-nav button{
  border:none;border-radius:9px;padding:8px 13px;background:transparent;
  color:var(--muted);font-size:10px;font-weight:700
}
.desktop-nav button.active{background:linear-gradient(135deg,var(--green),var(--cyan));color:#04120d}
.mobile-nav{display:none}

/* PANELS */
.panel{display:none}.panel.active{display:block}
.layout{display:grid;grid-template-columns:1.5fr .7fr;gap:12px}
.card{
  padding:17px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(14,23,42,.83),rgba(8,15,28,.74))
}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}
.section-head h2{margin:0;font-size:14px}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:9px}
.small-tag{
  display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;
  color:var(--green);background:rgba(40,224,162,.08);
  border:1px solid rgba(40,224,162,.14);font-size:8px;font-weight:900
}

/* RANKING */
.ranking{display:flex;flex-direction:column;gap:7px}
.rank{
  display:grid;grid-template-columns:28px 65px 1fr 40px;gap:9px;align-items:center;
  padding:9px;border-radius:12px;background:rgba(4,10,21,.48)
}
.rank-no{color:#62728a;font-size:9px}.rank-symbol{font-size:11px;font-weight:900}
.rank-track{height:5px;background:#18243a;border-radius:999px;overflow:hidden}
.rank-track div{height:100%;background:linear-gradient(90deg,var(--green),var(--blue))}
.rank-score{text-align:right;font-size:10px;font-weight:900}

/* STATUS */
.status-row{
  display:flex;justify-content:space-between;align-items:center;min-height:42px;
  border-bottom:1px solid var(--line);font-size:10px
}
.status-row:last-child{border-bottom:0}.status-row span{color:var(--muted)}

/* OPPORTUNITIES */
.opportunity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opportunity{
  position:relative;overflow:hidden;padding:15px;border:1px solid var(--line);
  border-radius:18px;background:rgba(8,15,29,.66)
}
.opportunity:before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--green),var(--blue))
}
.op-top{display:flex;justify-content:space-between;align-items:center}
.op-symbol{font-size:18px;font-weight:950}.op-source{margin-top:3px;color:var(--muted);font-size:7px}
.priority-ring{
  width:45px;height:45px;display:grid;place-items:center;border-radius:50%;
  border:3px solid var(--green);font-size:11px;font-weight:900
}
.wait-chip,.open-chip,.active-chip,.off-chip{
  display:inline-flex;padding:5px 7px;border-radius:999px;margin-top:9px;font-size:7px;font-weight:900
}
.wait-chip{color:var(--yellow);background:rgba(255,200,87,.09)}
.open-chip{color:var(--green);background:rgba(40,224,162,.09);margin:0}
.active-chip{color:#03120d;background:var(--green);margin:0}
.off-chip{color:var(--muted);background:rgba(130,145,168,.12);margin:0}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.level{padding:9px;border-radius:10px;background:rgba(2,8,17,.45)}
.level span,.portfolio-main span,.portfolio-levels span,.trail-grid span{
  display:block;color:var(--muted);font-size:7px;letter-spacing:.5px
}
.level strong,.portfolio-main strong,.portfolio-levels strong,.trail-grid strong{
  display:block;margin-top:4px;font-size:10px
}
.confirm strong{color:var(--green)}.invalid strong{color:#ff8992}
.reason{margin-top:10px;color:#8190a6;font-size:8px;line-height:1.5}


/* V16 EXPLAINABILITY + OPEN-SOURCE CHART */
.state-chip{
  display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;
  font-size:7px;font-weight:900;letter-spacing:.2px;margin:0 4px 0 0
}
.state-buy{color:#03120d;background:var(--green)}
.state-ready{color:var(--yellow);background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.25)}
.state-pre{color:#9dc7ff;background:rgba(87,156,255,.11);border:1px solid rgba(87,156,255,.22)}
.state-early{color:#c6b6ff;background:rgba(154,120,255,.11);border:1px solid rgba(154,120,255,.22)}
.state-broken{color:#ff7b86;background:rgba(255,107,120,.13);border:1px solid rgba(255,107,120,.30)}
.ranking-more-wrap{display:flex;justify-content:center;margin-top:10px}
.ranking-more-btn{
  min-height:36px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line);background:rgba(9,16,30,.72);
  color:#dbe4f0;font-size:11px;font-weight:800;cursor:pointer
}
.ranking-more-btn:hover{border-color:rgba(70,220,210,.45)}
.volatility-warning{
  margin-top:10px;padding:10px 12px;border-radius:11px;
  font-size:11px;font-weight:900;line-height:1.45
}
.volatility-warning.high{
  border:1px solid rgba(255,190,70,.42);
  background:rgba(255,190,70,.11);color:#ffd784
}
.volatility-warning.extreme{
  border:1px solid rgba(255,90,105,.48);
  background:rgba(255,90,105,.13);color:#ff9aa5
}


.risk-box{
  margin-top:10px;padding:10px 11px;border:1px solid rgba(255,255,255,.08);
  border-radius:12px;background:rgba(5,12,22,.58)
}
.risk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.risk-title{font-size:8px;font-weight:800;letter-spacing:.08em;color:#c8d4e5}
.risk-gate{font-size:7px;font-weight:900;padding:5px 8px;border-radius:999px}
.risk-eligible{background:rgba(40,224,162,.13);color:#28e0a2;border:1px solid rgba(40,224,162,.28)}
.risk-caution{background:rgba(241,199,91,.13);color:#f1c75b;border:1px solid rgba(241,199,91,.28)}
.risk-blocked{background:rgba(255,107,120,.13);color:#ff6b78;border:1px solid rgba(255,107,120,.28)}
.risk-paper{background:rgba(74,163,255,.13);color:#75b7ff;border:1px solid rgba(74,163,255,.28)}
.risk-monitor{background:rgba(145,160,181,.13);color:#aebbd0;border:1px solid rgba(145,160,181,.25)}
.risk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.risk-grid div{background:rgba(255,255,255,.025);border-radius:8px;padding:7px}
.risk-grid span{display:block;font-size:6.5px;color:#7f90a8;margin-bottom:2px}
.risk-grid strong{font-size:8px;color:#edf5ff}
.risk-reason{font-size:7px;color:#93a4bb;line-height:1.5;margin-top:7px}

.why-box{
  margin-top:11px;padding:10px;border:1px solid var(--line);border-radius:12px;
  background:rgba(4,10,20,.48)
}
.why-title{font-size:8px;font-weight:900;letter-spacing:.45px;color:#dbe7f7}
.why-list{margin:7px 0 0 14px;padding:0;color:#8fa0b7;font-size:8px;line-height:1.55}
.why-list li{margin:2px 0}
.chart-btn{
  width:100%;margin-top:10px;padding:9px 11px;border-radius:11px;
  border:1px solid rgba(40,224,162,.28);background:rgba(40,224,162,.08);
  color:var(--green);font-size:8px;font-weight:900;cursor:pointer
}
.chart-btn:active{transform:translateY(1px)}
.chart-modal-card{
  width:min(94vw,900px);max-height:92vh;overflow:auto;padding:14px;
  border-radius:18px;border:1px solid var(--line);background:#08111f
}
.chart-modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px
}
.chart-modal-title{font-size:18px;font-weight:950}
.chart-modal-sub{margin-top:3px;color:var(--muted);font-size:8px}
.chart-close{
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dfe7f2;
  border-radius:10px;padding:7px 10px;cursor:pointer
}
.chart-toolbar{
  display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px
}
.chart-level-chip{
  padding:5px 7px;border-radius:999px;background:rgba(255,255,255,.045);
  border:1px solid var(--line);font-size:7px;color:#aab8ca
}
#hanzChartWrap{width:100%}
#hanzChart{width:100%;height:330px;border-radius:12px 12px 0 0;overflow:hidden;background:#07101d}
#hanzVolume{width:100%;height:120px;border-radius:0 0 12px 12px;overflow:hidden;background:#07101d;border-top:1px solid rgba(255,255,255,.06)}
.volume-legend{
  display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px
}
.volume-legend .chart-level-chip strong{color:var(--green)}

.chart-status{
  padding:14px;text-align:center;color:var(--muted);font-size:9px
}

.chart-basis-note{
  margin:8px 0 10px;padding:9px 10px;border-radius:11px;
  border:1px solid rgba(40,224,162,.20);background:rgba(40,224,162,.055);
  color:#aebfd2;font-size:8px;line-height:1.5
}
.chart-basis-note strong{color:var(--green)}


.hanz-fallback-wrap{
  width:100%;background:#07101d;border-radius:12px;overflow:hidden;
  border:1px solid rgba(255,255,255,.06)
}
.hanz-fallback-svg{display:block;width:100%;height:auto;background:#07101d}
.hanz-fallback-note{
  padding:7px 10px;border-top:1px solid rgba(255,255,255,.06);
  color:#8fa0b7;font-size:7px;line-height:1.45
}

.chart-attribution{
  margin-top:8px;color:var(--muted);font-size:7px;line-height:1.5
}
.chart-attribution a{color:var(--green)}
@media(max-width:620px){
  #hanzChart{height:280px}
  #hanzVolume{height:110px}
  .chart-modal-card{padding:10px}
}

/* PORTFOLIO */
.portfolio-lock{display:none;padding:40px 15px;text-align:center;color:var(--muted)}
.portfolio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.portfolio-card{
  padding:15px;border:1px solid var(--line);border-radius:18px;background:rgba(7,14,27,.65)
}
.portfolio-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.portfolio-symbol{font-size:19px;font-weight:950}.portfolio-date{margin-top:3px;color:var(--muted);font-size:8px}
.portfolio-main{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.portfolio-main>div,.portfolio-levels>div,.trail-grid>div{
  padding:9px;border-radius:10px;background:rgba(2,8,17,.43)
}
.portfolio-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
.trailing-box{
  margin-top:9px;padding:11px;border-radius:13px;border:1px solid rgba(77,163,255,.16);
  background:linear-gradient(145deg,rgba(77,163,255,.07),rgba(40,224,162,.045))
}
.trailing-head{display:flex;justify-content:space-between;align-items:center;gap:10px;m

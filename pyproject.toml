[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanz-intelligence"
version = "1.1.0"
description = "Evidence-first market scanner with decision-quality analytics, paper trading, and no-lookahead validation"
requires-python = ">=3.10"
dependencies = ["yfinance>=0.2.65,<1", "pandas>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]
